<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Feedback Survey</title>

  <!-- External stylesheet you can create/edit in styles.css -->
  <link rel="stylesheet" href="style.css" />

</head>
<body>
  <div class="container">
    <h1 id="title">Community Feedback Survey</h1>
    <p id="description">
      This is a survey form to gather feedback from our community members. Your input is valuable to us and will help improve our services.
    </p>

    <form id="survey-form">
      <!-- Name -->
      <label id="name-label" class="text-label" for="name">Name</label>
      <input
        id="name"
        name="name"
        type="text"
        placeholder="Enter your full name"
        required
      />

      <!-- Email -->
      <label id="email-label" class="text-label" for="email">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        placeholder="Enter a valid email address"
        required
      />

      <!-- Number -->
      <label id="number-label" class="text-label" for="number">Age <small>(optional)</small></label>
      <input
        id="number"
        name="age"
        type="number"
        min="10"
        max="120"
        placeholder="Enter your age"
      />

      <!-- Select Dropdown -->
      <label for="dropdown" class="text-label">Which option best describes your current role?</label>
      <select id="dropdown" name="role" required>
        <option value="">Select current role</option>
        <option value="student">Student</option>
        <option value="full-time-job">Full Time Job</option>
        <option value="learner">Full Time Learner</option>
        <option value="prefer-not">Prefer not to say</option>
        <option value="other">Other</option>
      </select>

      <!-- Radio Buttons -->
      <fieldset>
        <legend>Would you recommend our community to a friend?</legend>
        <label><input type="radio" name="recommend" value="definitely" checked />Definitely</label>
        <label><input type="radio" name="recommend" value="maybe" />Maybe</label>
        <label><input type="radio" name="recommend" value="not-sure" />Not sure</label>
      </fieldset>

      <!-- Checkboxes -->
      <fieldset>
        <legend>
          What would you like to see improved? <small>(Check all that apply)</small>
        </legend>
        <label><input type="checkbox" name="improve" value="projects" />Front‑end
          Projects</label>
        <label><input type="checkbox" name="improve" value="back-end" />Back‑end
          Projects</label>
        <label><input type="checkbox" name="improve" value="data-visualization" />Data
          Visualization</label>
        <label><input type="checkbox" name="improve" value="challenges" />Coding
          Challenges</label>
        <label><input type="checkbox" name="improve" value="open-source" />Open Source
          Community</label>
      </fieldset>

      <!-- Textarea -->
      <label for="comments" class="text-label">Any comments or suggestions?</label>
      <textarea
        id="comments"
        name="comments"
        rows="4"
        placeholder="Enter your comment here..."
      ></textarea>

      <!-- Submit Button -->
      <button id="submit" type="submit"><b>Submit</b></button>
    </form>
  </div>
</body>
</html>
